<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Sign Up | Next Hire</title>
    <link rel="stylesheet" href="style-user-sign-up.css">
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">
            <img src="logo-nh.png" alt="Logo" />
            <span>User Portal</span>
        </div>
        <div class="nav-links">
            <a href="Main-Page.html" target="_blank">Home</a>
            <a href="About-Us.html" target="_blank">About Us</a>
            <a href="Contact.html" target="_blank">Contact</a>
        </div>
    </div>

    <!-- Hero Background and Form -->
    <div class="hero-wrapper">
        <div class="form-container">
            <h2>User Sign Up</h2>
            <form id="signupForm" method="POST" action="/api/student/signup">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstname" required placeholder="First name">

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastname" required placeholder="Last name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="+971 00 000 0000" maxlength="13">

                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Password" minlength="8">
                    <span class="eye-icon" onclick="togglePassword('password', this)">👁️</span>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" name="confirmpassword" required placeholder="Confirm Password" minlength="8">
                    <span class="eye-icon" onclick="togglePassword('confirmPassword', this)">👁️</span>
                </div>

                <button type="submit">Sign Up</button>
            </form>
            <p class="form-footer">
                Already have an account?
                <a href="User-Login.html">Log in</a>
            </p>
        </div>
    </div>
    <script>
        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "Hide";
            } else {
                input.type = "password";
                icon.textContent = "👁️";
            }
        }
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const firstName = this.firstname.value.trim();
  const lastName = this.lastname.value.trim();
  const email = this.email.value.trim();
  const phone = this.phone.value.trim();
  const password = this.password.value;
  const confirmPassword = this.confirmpassword.value;

  if (!firstName || !lastName || !email || !phone || !password || !confirmPassword) {
    alert('Please fill all fields.');
    return;
  }

  // Password pattern check
  const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
  if (!passwordPattern.test(password)) {
    alert('Password must be at least 8 characters and include uppercase, lowercase, number, and special character.');
    return;
  }

  if (password !== confirmPassword) {
    alert('Passwords do not match.');
    return;
  }

  const data = { firstName, lastName, email, phone, password };

  try {
    const res = await fetch('/api/student/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (res.ok) {
      alert('Signup successful! Redirecting...');
      window.location.href = '/student/dashboard';
    } else {
      alert('Signup failed: ' + (result.error || 'Unknown error'));
    }
  } catch (err) {
    alert('Server error. Please try again later.');
  }
});

    </script>


</body>
</html>
